<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lojinha do SLV | Projeto E-commerce</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>

  <link rel="stylesheet" href="styles.css" />
</head>

<body>

<div id="header"></div>

<section class="hero text-center text-white d-flex align-items-center">
  <div class="container">
    <h1 class="display-4 fw-bold">Lojinha do SLV</h1>
    <p class="lead">Projeto de E-commerce desenvolvido para portfólio</p>
    <a href="#produtos" class="btn btn-success btn-lg mt-3">Ver Produtos</a>
  </div>
</section>

<main id="produtos">
  <div class="container my-5">
    <h2 class="mb-4 text-center">Nossos Produtos</h2>
    <div class="row g-4" id="produtos-container"></div>
  </div>
</main>

<section class="bg-dark text-white py-5">
  <div class="container text-center">
    <h2>Sobre o Desenvolvedor</h2>
    <p>
      Este projeto foi desenvolvido por <strong>Silva</strong> como demonstração
      de habilidades em HTML, CSS, Bootstrap e JavaScript.
    </p>
  </div>
</section>

<div id="footer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="scripts/produtos.js"></script>
<script defer src="scripts/components.js"></script>

</html>
